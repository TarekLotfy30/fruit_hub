name: fruit_hub
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons package for Cupertino design
  cupertino_icons: ^1.0.8
  
  # Toast notifications for user feedback messages
  fluttertoast: ^8.2.12
  
  # Internationalization and localization support
  easy_localization: ^3.0.7+1
  
  # Dependency injection container for managing app dependencies
  get_it: ^8.0.3
  
  # Functional programming utilities (Either, Option, etc.)
  dartz: ^0.10.1
  
  # Value equality for objects without boilerplate
  equatable: ^2.0.7
  
  # Shimmer loading effect for skeleton screens
  shimmer: ^3.0.0
  
  # Smooth animations and transitions
  flutter_animate: ^4.5.2
  
  # Page indicator dots for onboarding/carousel screens
  smooth_page_indicator: ^1.2.1
  
  # Local storage for user preferences and app data
  shared_preferences: ^2.5.3
  
  # Network image loading with caching capabilities
  cached_network_image: ^3.4.1
  
  # Business Logic Component pattern for state management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  
  # Responsive UI utilities for different screen sizes
  flutter_screenutil: ^5.9.3
  
  # Native splash screen configuration
  flutter_native_splash: ^2.4.6
  
  # SVG image rendering support
  flutter_svg: ^2.1.0
  connectivity_plus: ^6.1.4
  
  # Animation and transition effects
  animate_do: ^4.2.0

dev_dependencies:
  # Flutter testing framework for unit and widget tests
  flutter_test:
    sdk: flutter

  # Dart code analysis rules and linting for code quality
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/Frame.png
  #branding: assets/branding.png
  color_dark: "#121212"
  image_dark: assets/images/Frame.png
  #branding_dark: assets/branding_dark.png

  android_12:
    image: assets/images/android12splash.png
    icon_background_color: "#ffffff"
    #image_dark: assets/images/Frame.png
    #icon_background_color_dark: "#121212"
    #branding: assets/android12/branding.png
    #branding_dark: assets/android12/branding_dark.png

  web: false

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/translations/
    - assets/fonts/
    - assets/images/
    - assets/svgs/
    - assets/svgs/onboarding/


  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
